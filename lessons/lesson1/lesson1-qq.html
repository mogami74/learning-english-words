<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レッスン1 - 日本語を繰り返して表示</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .word-display {
            background: #f7fafc;
            border: 3px solid #e2e8f0;
            border-radius: 15px;
            padding: 60px 40px;
            margin: 30px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 500px;
        }
        
        .word-display:hover {
            background: #fef5e7;
            border-color: #f5576c;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.1);
        }
        
        .word-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 15px;
        }
        
        .word-category {
            background: #f5576c;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1em;
            margin-bottom: 10px;
        }
        
        .instruction {
            color: #718096;
            font-size: 1.1em;
            margin-top: 15px;
        }
        
        .back-button {
            padding: 15px 30px;
            background: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: center;
            margin-top: 30px;
        }
        
        .back-button:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日本語を繰り返して表示</h1>
        
        <div class="main-content">
            <div class="word-display loading" id="wordDisplay">
                <div class="word-category" id="wordCategory">読み込み中...</div>
                <div class="word-text" id="wordText">wordlistを読み込んでいます...</div>
                <div class="instruction" id="instruction">しばらくお待ちください</div>
            </div>
        </div>
        
        <button class="back-button" id="backButton">← メイン画面に戻る</button>
    </div>

    <!-- Unit1WordListクラスを読み込み -->
    <script src="./unit1.js"></script>
    <script>
        // 現在の単語
        let currentWord = null;

        // DOM要素
        const wordDisplay = document.getElementById('wordDisplay');
        const wordText = document.getElementById('wordText');
        const wordCategory = document.getElementById('wordCategory');
        const instruction = document.getElementById('instruction');
        const backButton = document.getElementById('backButton');

        // 初期化
        async function init() {
            // wordlistが読み込まれるまで待つ
            const checkWordList = () => {
                if (window.unit1WordList && window.unit1WordList.getWords().length > 0) {
                    wordDisplay.classList.remove('loading');
                    showRandomJapanese();
                } else {
                    setTimeout(checkWordList, 100);
                }
            };
            checkWordList();
        }

        // ランダムな日本語を表示
        function showRandomJapanese() {
            currentWord = window.unit1WordList.getRandomWord();
            if (currentWord) {
                wordCategory.textContent = `単語 ${currentWord.id}`;
                wordText.textContent = currentWord.japanese;
                instruction.textContent = 'クリックして次の日本語を表示';
            }
        }

        // 単語表示エリアのクリックイベント
        wordDisplay.addEventListener('click', () => {
            if (wordDisplay.classList.contains('loading')) return;
            showRandomJapanese();
        });

        // 戻るボタンのクリックイベント
        backButton.addEventListener('click', () => {
            // メイン画面に戻る
            window.location.href = '/index.html';
        });

        // 初期化実行
        init();
    </script>
</body>
</html>
